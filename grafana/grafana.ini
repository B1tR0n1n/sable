[server]
root_url = http://localhost:3000

[security]
admin_user = sable
admin_password = sable

[auth.anonymous]
enabled = true
org_role = Viewer

[users]
default_theme = dark

[panels]
disable_sanitize_html = true

[plugins]
allow_loading_unsigned_plugins = sable-topology-panel

[unified_alerting]
enabled = true

[log]
mode = console
level = info
