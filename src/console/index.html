<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SABLE Operations Console</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'JetBrains Mono',monospace;background:#08080d;color:#c8c8d8;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #1a1a2e;background:#0d0d15}
.hdr-left{display:flex;align-items:center;gap:12px}
.logo{font-size:18px;font-weight:700;color:#e8e8f0;letter-spacing:3px}
.sub{font-size:10px;color:#555;letter-spacing:1px}
.controls{display:flex;gap:8px;align-items:center}
select,input[type=number],input[type=text]{background:#12121e;color:#aaa;border:1px solid #222;padding:6px 10px;font-size:11px;font-family:inherit;border-radius:3px;outline:none}
select:focus,input:focus{border-color:#3a3a5e}
input[type=number]{width:60px}
button{background:#1a1a2e;color:#8888cc;border:1px solid #2a2a4e;padding:6px 14px;font-size:11px;cursor:pointer;border-radius:3px;font-family:inherit;letter-spacing:1px;transition:background .15s}
button:hover{background:#25254a}
button:active{transform:scale(.98)}
.btn-danger{background:#1a0808;color:#F44336;border-color:#3a1515}
.btn-danger:hover{background:#2a1010}
.btn-ai{background:#101025;color:#6666cc;border-color:#2a2a4e}
.btn-ai:hover{background:#1a1a3a}
.btn-sm{padding:4px 8px;font-size:10px}
.main{display:flex;flex:1;overflow:hidden}
.graph-area{flex:1;display:flex;flex-direction:column;border-right:1px solid #1a1a2e;position:relative}
.status-bar{display:flex;gap:16px;padding:8px 16px;border-bottom:1px solid #111;font-size:10px;background:#0a0a10;align-items:center}
.status-bar .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.status-bar .right{margin-left:auto;color:#F44336}
.svg-wrap{flex:1;overflow:hidden}
.svg-wrap svg{width:100%;height:100%;display:block}
.playback{position:absolute;bottom:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;background:#0d0d18ee;padding:8px 14px;border-radius:4px;border:1px solid #1a1a2e;backdrop-filter:blur(8px)}
.playback input[type=range]{flex:1;accent-color:#F44336;height:4px}
.panel{width:360px;display:flex;flex-direction:column;background:#0a0a12;overflow:hidden}
.panel-section{padding:14px;border-bottom:1px solid #1a1a2e}
.panel-section:last-child{border-bottom:none}
.panel-title{font-size:10px;color:#555;letter-spacing:1px;margin-bottom:8px}
.node-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.node-icon{font-size:20px;line-height:1}
.node-name{font-size:13px;color:#e8e8f0;font-weight:600}
.node-type{font-size:10px}
.node-stats{display:flex;gap:12px;font-size:11px}
.trace-area{flex:1;overflow-y:auto;padding:14px}
.trace-area::-webkit-scrollbar{width:4px}
.trace-area::-webkit-scrollbar-track{background:#0a0a12}
.trace-area::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:2px}
.trace-item{font-size:10px;padding:4px 6px;border-radius:2px;margin-bottom:3px;border-left:2px solid #333}
.trace-item .tick{color:#555}
.trace-item .comp{color:#ccc}
.trace-item .cause{color:#555}
.ai-area{padding:14px;overflow-y:auto;max-height:300px}
.ai-area::-webkit-scrollbar{width:4px}
.ai-area::-webkit-scrollbar-track{background:#0a0a12}
.ai-area::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:2px}
.ai-response{font-size:11px;color:#aaa;line-height:1.6;white-space:pre-wrap}
.empty{font-size:11px;color:#444}
.config-bar{padding:8px 20px;background:#0a0a12;border-bottom:1px solid #1a1a2e;display:flex;gap:12px;align-items:center}
.config-bar label{font-size:10px;color:#555}
.config-bar input[type=text]{width:300px}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:6px 16px;font-size:9px;color:#555;border-bottom:1px solid #0d0d15}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-swatch{width:10px;height:10px;border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-left">
    <div class="logo">SABLE</div>
    <div class="sub">OPERATIONS CONSOLE</div>
  </div>
  <div class="controls">
    <select id="template">
      <option value="small_office">Small Office</option>
      <option value="enterprise_campus">Enterprise Campus</option>
      <option value="vdi_environment">VDI Environment</option>
      <option value="healthcare_network">Healthcare Network</option>
    </select>
    <input type="number" id="seed" value="42" title="Seed">
    <button onclick="generate()">GENERATE</button>
    <button class="btn-sm" onclick="toggleConfig()" title="Settings">&#9881;</button>
  </div>
</div>

<div class="config-bar" id="configBar" style="display:none">
  <label>LLM ENDPOINT:</label>
  <input type="text" id="llmEndpoint" value="http://127.0.0.1:8080">
  <span style="font-size:9px;color:#444">Run: llama-server -m model.gguf --port 8080</span>
</div>

<div class="main">
  <div class="graph-area">
    <div class="status-bar" id="statusBar">
      <span><span class="dot" style="background:#4CAF50"></span><span id="statHealthy">0</span> healthy</span>
      <span><span class="dot" style="background:#FF9800"></span><span id="statDegraded">0</span> degraded</span>
      <span><span class="dot" style="background:#F44336"></span><span id="statFailed">0</span> failed</span>
      <span><span class="dot" style="background:#9E9E9E"></span><span id="statUnreachable">0</span> unreachable</span>
      <span class="right" id="incidentStatus"></span>
    </div>
    <div class="svg-wrap">
      <svg id="graph" viewBox="0 0 960 620"></svg>
    </div>
    <div class="playback" id="playback" style="display:none">
      <button class="btn-sm" id="btnPlay" onclick="togglePlay()">&#9654;</button>
      <input type="range" id="tickSlider" min="0" max="0" value="0" oninput="jumpToTick(+this.value)">
      <span style="font-size:10px;color:#888;min-width:50px" id="tickLabel">t=0/0</span>
      <button class="btn-sm" onclick="jumpToTick(0)">&#9198;</button>
      <button class="btn-sm" onclick="jumpToEnd()">&#9197;</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-section">
      <div class="panel-title">COMPONENT INSPECTOR</div>
      <div id="inspector"><div class="empty">Click a node to inspect</div></div>
    </div>
    <div class="panel-section trace-area" id="traceArea">
      <div class="panel-title">CASCADE TRACE</div>
      <div id="traceList"></div>
    </div>
    <div class="panel-section ai-area" id="aiArea" style="display:none">
      <div class="panel-title">AI ANALYSIS</div>
      <div id="aiContent"></div>
    </div>
    <div class="panel-section" id="resetArea" style="display:none">
      <button onclick="generate()" style="width:100%">&#8634; RESET</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// SABLE OPERATIONS CONSOLE
// ============================================================================

const W = 960, H = 620;
const TYPE_COLORS = {
  CORE_SWITCH:"#2196F3",ACCESS_SWITCH:"#64B5F6",FIREWALL:"#FF5722",ROUTER:"#FF7043",
  LOAD_BALANCER:"#AB47BC",SERVER_PHYSICAL:"#66BB6A",SERVER_VIRTUAL:"#81C784",
  HYPERVISOR:"#43A047",STORAGE_ARRAY:"#FFA726",STORAGE_TARGET:"#FFB74D",
  VDI_BROKER:"#5C6BC0",VDI_HOST:"#7986CB",DNS_SERVER:"#26A69A",DHCP_SERVER:"#4DB6AC",
  DOMAIN_CONTROLLER:"#EC407A",CERTIFICATE_AUTHORITY:"#F48FB1",MONITORING_SERVER:"#78909C",
  WAN_LINK:"#8D6E63",INTERNET_GATEWAY:"#EF5350",APPLICATION_SERVICE:"#9CCC65"
};
const STATE_COLORS = {healthy:"#4CAF50",degraded:"#FF9800",failed:"#F44336",unreachable:"#9E9E9E"};
const TYPE_SHORT = {
  CORE_SWITCH:"Core SW",ACCESS_SWITCH:"Acc SW",FIREWALL:"FW",ROUTER:"RTR",
  LOAD_BALANCER:"LB",SERVER_PHYSICAL:"Phys Srv",SERVER_VIRTUAL:"VM",
  HYPERVISOR:"HV",STORAGE_ARRAY:"Storage",STORAGE_TARGET:"Stor Tgt",
  VDI_BROKER:"VDI Brkr",VDI_HOST:"VDI Host",DNS_SERVER:"DNS",DHCP_SERVER:"DHCP",
  DOMAIN_CONTROLLER:"DC",CERTIFICATE_AUTHORITY:"CA",MONITORING_SERVER:"Monitor",
  WAN_LINK:"WAN",INTERNET_GATEWAY:"IGW",APPLICATION_SERVICE:"App Svc"
};
const TIERS = {
  WAN_LINK:0,INTERNET_GATEWAY:.1,FIREWALL:.2,ROUTER:.2,CORE_SWITCH:.35,
  ACCESS_SWITCH:.5,LOAD_BALANCER:.5,SERVER_PHYSICAL:.6,STORAGE_ARRAY:.6,
  HYPERVISOR:.7,STORAGE_TARGET:.7,SERVER_VIRTUAL:.78,DNS_SERVER:.82,DHCP_SERVER:.82,
  DOMAIN_CONTROLLER:.82,CERTIFICATE_AUTHORITY:.82,MONITORING_SERVER:.88,
  VDI_BROKER:.82,VDI_HOST:.9,APPLICATION_SERVICE:.92
};

let topo = null, positions = {}, simState = {}, trace = [], fullState = {};
let selectedNode = null, injectedNode = null, currentTick = 0, maxTick = 0;
let playing = false, playTimer = null;

// --- SEEDED RNG ---
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function rngChoice(r,a){return a[Math.floor(r()*a.length)]}

// --- TOPOLOGY GENERATORS ---
function genSmallOffice(seed){
  const r=mulberry32(seed),n=[],e=[];
  const add=(id,t)=>n.push({id,type:t,state:"healthy",health:1});
  const dep=(s,t,ty,c)=>e.push({source_id:s,target_id:t,type:ty,criticality:c});
  add("fw-01","FIREWALL");add("igw-01","INTERNET_GATEWAY");add("wan-01","WAN_LINK");
  dep("wan-01","igw-01","NETWORK_PATH","HARD");dep("igw-01","fw-01","NETWORK_PATH","HARD");
  add("sw-core-01","CORE_SWITCH");dep("fw-01","sw-core-01","NETWORK_PATH","HARD");
  add("sw-acc-01","ACCESS_SWITCH");add("sw-acc-02","ACCESS_SWITCH");
  dep("sw-acc-01","sw-core-01","NETWORK_PATH","HARD");dep("sw-acc-02","sw-core-01","NETWORK_PATH","HARD");
  add("srv-phys-01","SERVER_PHYSICAL");dep("srv-phys-01","sw-acc-01","NETWORK_PATH","HARD");
  add("dns-01","DNS_SERVER");add("dhcp-01","DHCP_SERVER");add("dc-01","DOMAIN_CONTROLLER");
  ["dns-01","dhcp-01","dc-01"].forEach(id=>{dep(id,"srv-phys-01","HOSTING_DEPENDENCY","HARD");dep(id,"sw-acc-01","NETWORK_PATH","HARD")});
  add("mon-01","MONITORING_SERVER");dep("mon-01","srv-phys-01","HOSTING_DEPENDENCY","HARD");dep("mon-01","sw-acc-01","NETWORK_PATH","HARD");
  n.filter(x=>!["CORE_SWITCH","ACCESS_SWITCH","WAN_LINK","INTERNET_GATEWAY","DNS_SERVER"].includes(x.type)).forEach(x=>dep(x.id,"dns-01","DNS_DEPENDENCY","SOFT"));
  n.filter(x=>["SERVER_PHYSICAL","SERVER_VIRTUAL","HYPERVISOR","APPLICATION_SERVICE"].includes(x.type)).forEach(x=>dep(x.id,"dc-01","AUTHENTICATION_DEPENDENCY","SOFT"));
  return{nodes:n,edges:e,name:"Small Office"}
}

function genEnterpriseCampus(seed){
  const r=mulberry32(seed),n=[],e=[];
  const add=(id,t)=>n.push({id,type:t,state:"healthy",health:1});
  const dep=(s,t,ty,c)=>e.push({source_id:s,target_id:t,type:ty,criticality:c});
  add("fw-01","FIREWALL");add("fw-02","FIREWALL");add("rtr-01","ROUTER");add("rtr-02","ROUTER");
  add("igw-01","INTERNET_GATEWAY");add("wan-01","WAN_LINK");add("wan-02","WAN_LINK");
  dep("wan-01","igw-01","NETWORK_PATH","REDUNDANT");dep("wan-02","igw-01","NETWORK_PATH","REDUNDANT");
  dep("igw-01","rtr-01","NETWORK_PATH","REDUNDANT");dep("igw-01","rtr-02","NETWORK_PATH","REDUNDANT");
  dep("rtr-01","fw-01","NETWORK_PATH","HARD");dep("rtr-02","fw-02","NETWORK_PATH","HARD");
  add("sw-core-01","CORE_SWITCH");add("sw-core-02","CORE_SWITCH");
  dep("sw-core-01","sw-core-02","NETWORK_PATH","REDUNDANT");dep("sw-core-02","sw-core-01","NETWORK_PATH","REDUNDANT");
  dep("fw-01","sw-core-01","NETWORK_PATH","HARD");dep("fw-02","sw-core-02","NETWORK_PATH","HARD");
  for(let i=1;i<=4;i++){const id=`sw-acc-${String(i).padStart(2,"0")}`;add(id,"ACCESS_SWITCH");dep(id,"sw-core-01","NETWORK_PATH","REDUNDANT");dep(id,"sw-core-02","NETWORK_PATH","REDUNDANT")}
  for(let i=1;i<=4;i++){const id=`srv-phys-${String(i).padStart(2,"0")}`;add(id,"SERVER_PHYSICAL");dep(id,`sw-acc-${String(((i-1)%4)+1).padStart(2,"0")}`,"NETWORK_PATH","HARD")}
  add("hv-01","HYPERVISOR");add("hv-02","HYPERVISOR");
  dep("hv-01","srv-phys-01","HOSTING_DEPENDENCY","HARD");dep("hv-02","srv-phys-02","HOSTING_DEPENDENCY","HARD");
  for(let i=1;i<=4;i++){const id=`srv-vm-${String(i).padStart(2,"0")}`;add(id,"SERVER_VIRTUAL");dep(id,i<=2?"hv-01":"hv-02","HOSTING_DEPENDENCY","HARD")}
  add("stor-arr-01","STORAGE_ARRAY");add("stor-arr-02","STORAGE_ARRAY");
  dep("stor-arr-01","sw-acc-01","NETWORK_PATH","HARD");dep("stor-arr-02","sw-acc-02","NETWORK_PATH","HARD");
  add("stor-tgt-01","STORAGE_TARGET");add("stor-tgt-02","STORAGE_TARGET");
  dep("stor-tgt-01","stor-arr-01","STORAGE_DEPENDENCY","HARD");dep("stor-tgt-02","stor-arr-02","STORAGE_DEPENDENCY","HARD");
  dep("hv-01","stor-arr-01","STORAGE_DEPENDENCY","HARD");dep("hv-02","stor-arr-02","STORAGE_DEPENDENCY","HARD");
  add("dns-01","DNS_SERVER");add("dns-02","DNS_SERVER");add("dhcp-01","DHCP_SERVER");
  add("dc-01","DOMAIN_CONTROLLER");add("dc-02","DOMAIN_CONTROLLER");
  add("ca-01","CERTIFICATE_AUTHORITY");add("mon-01","MONITORING_SERVER");
  add("lb-01","LOAD_BALANCER");add("lb-02","LOAD_BALANCER");
  ["dns-01","dns-02","dhcp-01","dc-01","dc-02","ca-01","mon-01"].forEach((id,i)=>{dep(id,`srv-vm-${String((i%4)+1).padStart(2,"0")}`,"HOSTING_DEPENDENCY","HARD");dep(id,`sw-acc-${String((i%4)+1).padStart(2,"0")}`,"NETWORK_PATH","HARD")});
  dep("dc-01","dc-02","REPLICATION_DEPENDENCY","SOFT");
  dep("lb-01","sw-acc-01","NETWORK_PATH","HARD");dep("lb-02","sw-acc-02","NETWORK_PATH","HARD");
  add("app-01","APPLICATION_SERVICE");add("app-02","APPLICATION_SERVICE");
  dep("app-01","srv-vm-01","HOSTING_DEPENDENCY","HARD");dep("app-01","lb-01","SERVICE_DEPENDENCY","SOFT");
  dep("app-02","srv-vm-02","HOSTING_DEPENDENCY","HARD");dep("app-02","lb-02","SERVICE_DEPENDENCY","SOFT");
  n.filter(x=>!["CORE_SWITCH","ACCESS_SWITCH","WAN_LINK","INTERNET_GATEWAY","DNS_SERVER"].includes(x.type)).forEach(x=>dep(x.id,rngChoice(r,["dns-01","dns-02"]),"DNS_DEPENDENCY","REDUNDANT"));
  n.filter(x=>["SERVER_PHYSICAL","SERVER_VIRTUAL","HYPERVISOR","APPLICATION_SERVICE"].includes(x.type)).forEach(x=>dep(x.id,rngChoice(r,["dc-01","dc-02"]),"AUTHENTICATION_DEPENDENCY","REDUNDANT"));
  return{nodes:n,edges:e,name:"Enterprise Campus"}
}

function genVDI(seed){
  const base=genEnterpriseCampus(seed);const{nodes:n,edges:e}=base;
  const add=(id,t)=>n.push({id,type:t,state:"healthy",health:1});
  const dep=(s,t,ty,c)=>e.push({source_id:s,target_id:t,type:ty,criticality:c});
  add("vdi-broker-01","VDI_BROKER");add("vdi-broker-02","VDI_BROKER");
  dep("vdi-broker-01","srv-vm-01","HOSTING_DEPENDENCY","HARD");dep("vdi-broker-02","srv-vm-02","HOSTING_DEPENDENCY","HARD");
  dep("vdi-broker-01","sw-acc-01","NETWORK_PATH","HARD");dep("vdi-broker-02","sw-acc-02","NETWORK_PATH","HARD");
  for(let i=1;i<=8;i++){const id=`vdi-host-${String(i).padStart(2,"0")}`;add(id,"VDI_HOST");dep(id,i<=4?"hv-01":"hv-02","HOSTING_DEPENDENCY","HARD");dep(id,i<=4?"vdi-broker-01":"vdi-broker-02","SERVICE_DEPENDENCY","HARD");dep(id,i<=4?"stor-arr-01":"stor-arr-02","STORAGE_DEPENDENCY","HARD")}
  return{nodes:n,edges:e,name:"VDI Environment"}
}

function genHealthcare(seed){
  const base=genEnterpriseCampus(seed);const{nodes:n,edges:e}=base;const r=mulberry32(seed+100);
  const add=(id,t)=>n.push({id,type:t,state:"healthy",health:1});
  const dep=(s,t,ty,c)=>e.push({source_id:s,target_id:t,type:ty,criticality:c});
  ["ehr","pacs","pharmacy","lab","radiology"].forEach((name,i)=>{const id=`app-${name}-01`;add(id,"APPLICATION_SERVICE");dep(id,`srv-vm-${String((i%4)+1).padStart(2,"0")}`,"HOSTING_DEPENDENCY","HARD");dep(id,`sw-acc-${String((i%4)+1).padStart(2,"0")}`,"NETWORK_PATH","HARD");dep(id,rngChoice(r,["dns-01","dns-02"]),"DNS_DEPENDENCY","REDUNDANT")});
  dep("app-pacs-01","stor-arr-01","STORAGE_DEPENDENCY","HARD");
  add("stor-arr-03","STORAGE_ARRAY");dep("stor-arr-03","sw-acc-03","NETWORK_PATH","HARD");
  return{nodes:n,edges:e,name:"Healthcare Network"}
}

const GENERATORS={small_office:genSmallOffice,enterprise_campus:genEnterpriseCampus,vdi_environment:genVDI,healthcare_network:genHealthcare};

// --- LAYOUT ---
function computeLayout(nodes,edges){
  const pos={};const N=nodes.length;
  nodes.forEach((n,i)=>{const tier=TIERS[n.type]||.5;pos[n.id]={x:(.1+Math.sin(i*7.3+1.7)*.12+(i%6)*.13)*W,y:(.05+tier*.9)*H,vx:0,vy:0}});
  for(let iter=0;iter<150;iter++){
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=pos[nodes[i].id],b=pos[nodes[j].id];let dx=a.x-b.x,dy=a.y-b.y;const d=Math.max(Math.sqrt(dx*dx+dy*dy),1),f=9000/(d*d);a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
    edges.forEach(e=>{const a=pos[e.source_id],b=pos[e.target_id];if(!a||!b)return;let dx=b.x-a.x,dy=b.y-a.y;const d=Math.max(Math.sqrt(dx*dx+dy*dy),1),f=(d-90)*.012;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
    nodes.forEach(n=>{const p=pos[n.id];const ty=(TIERS[n.type]||.5);p.vy+=((.05+ty*.9)*H-p.y)*.06});
    nodes.forEach(n=>{const p=pos[n.id];p.x+=p.vx*.25;p.y+=p.vy*.25;p.vx*=.7;p.vy*=.7;p.x=Math.max(50,Math.min(W-50,p.x));p.y=Math.max(30,Math.min(H-30,p.y))});
  }
  return pos;
}

// --- CASCADE ENGINE ---
function simulateCascade(topo,targetId){
  const{nodes,edges}=topo;const state={};
  nodes.forEach(n=>{state[n.id]={state:"healthy",health:1}});
  const tr=[];
  state[targetId]={state:"failed",health:0};
  tr.push({tick:0,component_id:targetId,prev_state:"healthy",new_state:"failed",prev_health:1,new_health:0,cause:"injected_failure",cause_component:null});
  const depsOf={};
  edges.forEach(e=>{if(!depsOf[e.target_id])depsOf[e.target_id]=[];depsOf[e.target_id].push(e)});
  let changed=new Set([targetId]);
  for(let tick=1;tick<=30;tick++){
    const nc=[];const done=new Set();
    changed.forEach(cid=>{
      const cs=state[cid];(depsOf[cid]||[]).forEach(edge=>{
        const did=edge.source_id;if(done.has(did))return;const ds=state[did];if(ds.state==="failed")return;
        const ps=ds.state,ph=ds.health;
        if(edge.type==="MONITORING_DEPENDENCY")return;
        if(edge.type==="HOSTING_DEPENDENCY"&&cs.state==="failed"){ds.state="failed";ds.health=0;nc.push({tick,component_id:did,prev_state:ps,new_state:"failed",prev_health:ph,new_health:0,cause:"host_failure",cause_component:cid});done.add(did);return}
        if(edge.type==="HOSTING_DEPENDENCY"&&cs.state==="degraded"){ds.health=Math.max(0,ds.health-.4);if(ds.health<=.2)ds.state="failed";else if(ds.health<=.5)ds.state="degraded";if(ds.state!==ps){nc.push({tick,component_id:did,prev_state:ps,new_state:ds.state,prev_health:ph,new_health:ds.health,cause:"cascade_degradation",cause_component:cid});done.add(did)}return}
        if(edge.type==="NETWORK_PATH"&&cs.state==="failed"){if(edge.criticality==="HARD"){ds.state="unreachable";ds.health=0;nc.push({tick,component_id:did,prev_state:ps,new_state:"unreachable",prev_health:ph,new_health:0,cause:"network_unreachable",cause_component:cid});done.add(did)}else if(edge.criticality==="REDUNDANT"){ds.health=Math.max(0,ds.health-.15);if(ds.health<=.5)ds.state="degraded";if(ds.state!==ps){nc.push({tick,component_id:did,prev_state:ps,new_state:ds.state,prev_health:ph,new_health:ds.health,cause:"redundant_path_loss",cause_component:cid});done.add(did)}}return}
        if(cs.state==="failed"){
          if(edge.criticality==="HARD"){ds.state="failed";ds.health=0;nc.push({tick,component_id:did,prev_state:ps,new_state:"failed",prev_health:ph,new_health:0,cause:"hard_dependency_cascade",cause_component:cid});done.add(did)}
          else if(edge.criticality==="SOFT"){ds.health=Math.max(0,ds.health-.5);if(ds.health<=.2)ds.state="failed";else if(ds.health<=.5)ds.state="degraded";if(ds.state!==ps){nc.push({tick,component_id:did,prev_state:ps,new_state:ds.state,prev_health:ph,new_health:ds.health,cause:"soft_dependency_cascade",cause_component:cid});done.add(did)}}
        }
      })
    });
    if(!nc.length)break;
    nc.forEach(c=>tr.push(c));changed=new Set(nc.map(c=>c.component_id));
  }
  return{state,trace:tr}
}

// --- SVG RENDERING ---
function renderGraph(){
  if(!topo)return;
  const svg=document.getElementById("graph");
  const{nodes,edges}=topo;
  let html=`<defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fglow"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#F44336" flood-opacity=".5" result="c"/><feComposite in="c" in2="b" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="6" markerHeight="4" orient="auto"><path d="M0 0L10 3L0 6z" fill="#1a1a2e"/></marker>
    <marker id="arrR" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="7" markerHeight="5" orient="auto"><path d="M0 0L10 3L0 6z" fill="#F44336"/></marker>
  </defs><rect width="${W}" height="${H}" fill="#0a0a0f"/>`;

  const cascadeEdges=new Set();
  trace.filter(t=>t.tick<=currentTick&&t.cause_component).forEach(t=>{cascadeEdges.add(t.component_id+"|"+t.cause_component)});

  edges.forEach(e=>{
    const a=positions[e.source_id],b=positions[e.target_id];if(!a||!b)return;
    const isCasc=cascadeEdges.has(e.source_id+"|"+e.target_id)||cascadeEdges.has(e.target_id+"|"+e.source_id);
    html+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${isCasc?"#F44336":"#1a1a2e"}" stroke-width="${isCasc?2:.7}" opacity="${isCasc?.8:.35}" marker-end="${isCasc?"url(#arrR)":"url(#arr)"}"/>`;
  });

  nodes.forEach(n=>{
    const p=positions[n.id];if(!p)return;
    const s=simState[n.id]||{state:"healthy",health:1};
    const col=TYPE_COLORS[n.type]||"#888";const sc=STATE_COLORS[s.state]||"#4CAF50";
    const isFail=s.state==="failed"||s.state==="unreachable";
    const isSel=selectedNode===n.id;const r=isFail?13:(isSel?15:11);
    const opacity=s.state==="unreachable"?.35:1;
    const filt=isFail?' filter="url(#fglow)"':(isSel?' filter="url(#glow)"':"");
    if(isFail)html+=`<circle cx="${p.x}" cy="${p.y}" r="${r+10}" fill="${sc}" opacity=".12"/>`;
    html+=`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${col}" stroke="${sc}" stroke-width="${isSel?3:2}" opacity="${opacity}"${filt} data-node="${n.id}" style="cursor:pointer"/>`;
    if(s.health<1&&s.health>0)html+=`<text x="${p.x}" y="${p.y+3}" text-anchor="middle" fill="#fff" font-size="7" font-weight="600" font-family="JetBrains Mono" pointer-events="none">${Math.round(s.health*100)}%</text>`;
    html+=`<text x="${p.x}" y="${p.y+r+11}" text-anchor="middle" fill="#6668" font-size="7" font-family="JetBrains Mono" pointer-events="none">${n.id}</text>`;
  });

  svg.innerHTML=html;

  svg.querySelectorAll("circle[data-node]").forEach(el=>{
    el.addEventListener("click",()=>{selectedNode=el.dataset.node;renderGraph();renderInspector()});
  });
}

// --- UI UPDATES ---
function updateStats(){
  let h=0,d=0,f=0,u=0;
  Object.values(simState).forEach(s=>{if(s.state==="healthy")h++;else if(s.state==="degraded")d++;else if(s.state==="failed")f++;else u++});
  document.getElementById("statHealthy").textContent=h;
  document.getElementById("statDegraded").textContent=d;
  document.getElementById("statFailed").textContent=f;
  document.getElementById("statUnreachable").textContent=u;
  document.getElementById("incidentStatus").textContent=injectedNode?`INCIDENT ACTIVE — tick ${currentTick}/${maxTick}`:"";
}

function renderInspector(){
  const el=document.getElementById("inspector");
  if(!selectedNode||!topo){el.innerHTML='<div class="empty">Click a node to inspect</div>';return}
  const node=topo.nodes.find(n=>n.id===selectedNode);if(!node){el.innerHTML='<div class="empty">Node not found</div>';return}
  const s=simState[selectedNode]||{state:"healthy",health:1};
  const depCount=topo.edges.filter(e=>e.target_id===selectedNode).length;
  let h=`<div class="node-header"><div class="node-name">${node.id}</div></div>
    <div class="node-type" style="color:${TYPE_COLORS[node.type]||"#888"};margin-bottom:8px">${TYPE_SHORT[node.type]||node.type}</div>
    <div class="node-stats"><span>State: <span style="color:${STATE_COLORS[s.state]}">${s.state}</span></span>
    <span>Health: <span style="color:${s.health>.5?"#4CAF50":s.health>.2?"#FF9800":"#F44336"}">${Math.round(s.health*100)}%</span></span></div>
    <div style="font-size:10px;color:#555;margin-top:6px">${depCount} component${depCount===1?"":"s"} depend on this node</div>`;
  if(!injectedNode)h+=`<button class="btn-danger" onclick="injectFailure()" style="width:100%;margin-top:10px">&#9889; INJECT FAILURE</button>`;
  el.innerHTML=h;
}

function renderTrace(){
  const el=document.getElementById("traceList");
  const visible=trace.filter(t=>t.tick<=currentTick);
  if(!visible.length){el.innerHTML='<div class="empty">No cascade events</div>';return}
  el.innerHTML=visible.map(t=>`<div class="trace-item" style="border-color:${STATE_COLORS[t.new_state]}${t.new_state==="failed"?";background:#1a0808":""}">
    <span class="tick">t=${t.tick}</span> <span class="comp">${t.component_id}</span> <span style="color:${STATE_COLORS[t.new_state]}">${t.new_state}</span>
    ${t.cause_component?`<span class="cause"> ← ${t.cause_component}</span>`:""}
  </div>`).join("");
  el.scrollTop=el.scrollHeight;
}

// --- ACTIONS ---
function generate(){
  const tmpl=document.getElementById("template").value;
  const seed=parseInt(document.getElementById("seed").value)||42;
  const gen=GENERATORS[tmpl];if(!gen)return;
  topo=gen(seed);positions=computeLayout(topo.nodes,topo.edges);
  simState={};topo.nodes.forEach(n=>{simState[n.id]={state:"healthy",health:1}});
  trace=[];injectedNode=null;selectedNode=null;currentTick=0;maxTick=0;
  playing=false;clearInterval(playTimer);fullState={};
  document.getElementById("playback").style.display="none";
  document.getElementById("aiArea").style.display="none";
  document.getElementById("resetArea").style.display="none";
  renderGraph();updateStats();renderInspector();renderTrace();
}

function injectFailure(){
  if(!selectedNode||!topo)return;
  const result=simulateCascade(topo,selectedNode);
  fullState=result.state;injectedNode=selectedNode;trace=result.trace;
  maxTick=Math.max(...trace.map(t=>t.tick),0);currentTick=0;
  simState={};topo.nodes.forEach(n=>{simState[n.id]={state:"healthy",health:1}});
  simState[selectedNode]={state:"failed",health:0};
  document.getElementById("playback").style.display="flex";
  document.getElementById("tickSlider").max=maxTick;
  document.getElementById("tickSlider").value=0;
  document.getElementById("tickLabel").textContent=`t=0/${maxTick}`;
  document.getElementById("resetArea").style.display="block";
  document.getElementById("aiArea").style.display="none";
  renderGraph();updateStats();renderInspector();renderTrace();
}

function jumpToTick(tick){
  currentTick=tick;playing=false;clearInterval(playTimer);
  document.getElementById("btnPlay").innerHTML="&#9654;";
  simState={};topo.nodes.forEach(n=>{simState[n.id]={state:"healthy",health:1}});
  trace.filter(t=>t.tick<=tick).forEach(t=>{simState[t.component_id]={state:t.new_state,health:t.new_health}});
  document.getElementById("tickSlider").value=tick;
  document.getElementById("tickLabel").textContent=`t=${tick}/${maxTick}`;
  renderGraph();updateStats();renderTrace();renderInspector();
  if(tick>=maxTick&&injectedNode){document.getElementById("aiArea").style.display="block";showAIButton()}
}

function jumpToEnd(){jumpToTick(maxTick)}

function togglePlay(){
  if(playing){playing=false;clearInterval(playTimer);document.getElementById("btnPlay").innerHTML="&#9654;";return}
  if(currentTick>=maxTick){jumpToTick(0)}
  playing=true;document.getElementById("btnPlay").innerHTML="&#9646;&#9646;";
  playTimer=setInterval(()=>{
    if(currentTick>=maxTick){playing=false;clearInterval(playTimer);document.getElementById("btnPlay").innerHTML="&#9654;";
      document.getElementById("aiArea").style.display="block";showAIButton();return}
    jumpToTick(currentTick+1);
  },700);
}

function showAIButton(){
  const el=document.getElementById("aiContent");
  el.innerHTML=`<button class="btn-ai" onclick="askLLM()" style="width:100%">&#129504; ASK NEMOTRON</button>`;
}

function toggleConfig(){
  const el=document.getElementById("configBar");
  el.style.display=el.style.display==="none"?"flex":"none";
}

// --- LLM ---
async function askLLM(){
  if(!topo||!simState)return;
  const el=document.getElementById("aiContent");
  el.innerHTML='<div style="color:#555;font-size:11px">Analyzing...</div>';
  const{nodes}=topo;const failed=[],degraded=[],healthy=[];
  nodes.forEach(n=>{const s=simState[n.id];if(s.state==="failed"||s.state==="unreachable")failed.push(n);else if(s.state==="degraded")degraded.push(n);else healthy.push(n)});
  let prompt=`Answer in 2-3 concise paragraphs. No bullet lists. No tick-by-tick traces.\n\nYou are an infrastructure operations AI. An incident is in progress.\n\nTOPOLOGY: ${nodes.length} components, ${topo.edges.length} dependencies.\n\nALERTS:\n`;
  failed.forEach(n=>{prompt+=`- CRITICAL: ${n.id} (${TYPE_SHORT[n.type]}) is ${simState[n.id].state}\n`});
  degraded.forEach(n=>{prompt+=`- WARNING: ${n.id} (${TYPE_SHORT[n.type]}) degraded (health: ${Math.round(simState[n.id].health*100)}%)\n`});
  prompt+=`\nHealthy: ${healthy.length}/${nodes.length}\n\nWhat is the most likely root cause? What should the operator investigate first?`;
  const endpoint=document.getElementById("llmEndpoint").value;
  try{
    const res=await fetch(`${endpoint}/v1/chat/completions`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"local",messages:[{role:"user",content:prompt}],max_tokens:500,temperature:.6,top_p:.95})});
    const data=await res.json();
    el.innerHTML=`<div class="ai-response">${data.choices?.[0]?.message?.content||"No response"}</div>`;
  }catch(err){
    el.innerHTML=`<div class="ai-response" style="color:#F44336">Connection failed: ${err.message}\n\nStart llama-server:\nllama-server.exe -m model.gguf --port 8080</div>`;
  }
}

// --- INIT ---
generate();
</script>
