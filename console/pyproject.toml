[project]
name = "overlord-sable-console"
version = "0.1.0"
description = "OVERLORD x SABLE closed-loop remediation console"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pyyaml>=6",
  "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
claude = ["anthropic>=0.40"]

[tool.pytest.ini_options]
testpaths = ["console/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
